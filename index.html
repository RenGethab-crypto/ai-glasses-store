<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>AI Smart Glasses</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:40px 20px;
}

.product{
  display:flex;
  flex-wrap:wrap;
  gap:40px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(12px);
  border-radius:25px;
  padding:40px;
  box-shadow:0 0 40px rgba(0,0,0,0.4);
  align-items:center;
}

.product img{
  width:100%;
  max-width:420px;
  border-radius:20px;
}

.product h1{
  font-size:36px;
}

.product p{
  font-size:18px;
  line-height:1.5;
  opacity:0.9;
}

.price{
  font-size:32px;
  font-weight:bold;
  margin:20px 0;
}

.buy-btn{
  background:#00ffcc;
  color:#000;
  padding:15px 40px;
  font-size:18px;
  border:none;
  border-radius:30px;
  cursor:pointer;
}

.buy-btn:hover{
  background:#00ccaa;
}

form{
  margin-top:60px;
  background:rgba(255,255,255,0.06);
  padding:30px;
  border-radius:20px;
}

input,button{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:10px;
  border:none;
  font-size:16px;
}

@media(max-width:768px){
  .product{
    flex-direction:column;
    text-align:center;
  }
}
</style>

</head>
<body>

<div class="container">

<div class="product">
  <img src="glasses.jpg" alt="AI Glasses">

  <div>
    <h1>AI Smart Glasses</h1>
    <p>Умные очки с камерой, переводчиком, голосовым управлением и AI помощником.</p>
  <a href="https://t.me/smart_glasses_ai_bot" class="buy-btn">
  Оплатить 12 000 ₽
</a>  

<a href="https://nowpayments.io/payment/?iid=6432317681"
   target="_blank"
   class="buy-btn"
   style="display:block; text-align:center; margin-top:15px;">
  Оплатить 130 USDT
</a>  
  </div>
</div>

<form id="order" onsubmit="sendOrder(event)">
<h2>Оставить заявку</h2>
<input type="text" placeholder="фамилия Имя Отчество" required>
<input type="tel" placeholder="Телефон" required>
<input type="email" placeholder="Email" required>
<input type="text" placeholder="Адрес доставки (город, улица, дом, квартира)" required>  
<button type="submit" class="buy-btn">Отправить заявку</button>
</form>

</div>
<script>
const TELEGRAM_BOT_TOKEN = "7838340633:AAHLoQBi9lDxt8Cit7ZKETixJYyf3vSIDSM";
const CHAT_ID = "1518053105";

async function sendOrder(event) {
  event.preventDefault();

  const name = document.querySelector('#order input[type="text"]').value;
  const phone = document.querySelector('#order input[type="tel"]').value;
  const email = document.querySelector('#order input[type="email"]').value;
  const address = document.querySelector('#order input[type="email"]').value;
  const text = `
🕶 Новая заявка с сайта
ФИО: ${name}
Телефон: ${phone}
Email: ${email}
Адрес: ${address}
Товар: AI Smart Glasses
Цена: 12 000 ₽
`;

  const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

  await fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      chat_id: CHAT_ID,
      text: text
    })
  });

  alert("Заявка отправлена!");
  document.getElementById("order").reset();
}
</script>
</body>
</html>
